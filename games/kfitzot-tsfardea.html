<!doctype html>
<html lang="he">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קפיצות הצפרדע</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;600;800&display=swap">
<style>
/* layout: one rounded card over a pond; the number line is the pond's edge and the frog hops along it */
:root{
  --sky:#d3f1ff; --pond:#b8e6cf; --card:#fbfff8; --ink:#1f3a2e; --muted:#5f7a6c; --line:#d6eadf; --key:#eef8f1; --shadow:#8fcfae;
  --fw:#1e9e5e; --bw:#ee8a2a; --water:#2f86c8; --sun:#ffc531; --soft:#fff3c4; --ok:#1a9d5c; --done:#d3f0e0; --pad:#e2457a;
  --display:"Fredoka","Rubik",system-ui,"Arial Hebrew",sans-serif; --body:"Rubik",system-ui,"Arial Hebrew",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:linear-gradient(var(--sky),var(--pond) 70%);min-height:100%;color:var(--ink);font-family:var(--body);font-size:16px;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:3px solid var(--water);outline-offset:2px}
main{max-width:560px;margin:0 auto;background:var(--card);border-radius:28px;padding:18px;display:grid;gap:14px;box-shadow:0 8px 0 var(--shadow)}
.stack{display:grid;gap:14px}
h1,h2{margin:0;font-family:var(--display);text-align:center;text-wrap:balance}
h1{flex:1;font-size:1.7rem;font-weight:700} h2{font-size:1.5rem}
.sub{margin:0;text-align:center;color:var(--muted)}
header{display:flex;align-items:center;gap:8px}
.icon{font-size:1.4rem;width:48px;height:48px;border-radius:14px;border:0;background:var(--key);box-shadow:0 4px 0 var(--line)}
.icon:active,.btn:active,.lvl:active,.mode:active,.jb:active,.choices button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mx{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap}

/* home */
.hero{display:flex;align-items:center;justify-content:center;gap:12px}
.buddy{font-size:4.2rem;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.bubble{margin:0;background:var(--key);border-radius:18px;padding:10px 16px;font:600 1.2rem var(--display)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:grid;gap:2px;justify-items:center;padding:16px 8px;border-radius:22px;border:0;color:#fff;box-shadow:0 6px 0 rgba(31,58,46,.22)}
.mode .em{font-size:2.3rem;line-height:1.2} .mode b{font:700 1.3rem var(--display)} .mode small{font-size:.92rem;font-weight:600}
.m-map{background:var(--fw)} .m-album{background:var(--water)}
.label{margin:0;text-align:center;font-weight:600;color:var(--muted)}
.buddies{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.buddies button{font-size:1.8rem;width:54px;height:54px;border-radius:50%;border:3px solid transparent;background:var(--key)}
.buddies button[aria-pressed="true"]{border-color:var(--sun);background:var(--soft)}

/* level map */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.lvl{display:grid;justify-items:center;gap:4px;padding:12px 6px;border-radius:20px;border:0;background:var(--key);box-shadow:0 5px 0 var(--line)}
.lvl .num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:var(--soft)}
.lvl .nm{font-weight:600;font-size:.95rem;text-align:center}
.lvl .st{min-height:1.3em;font-size:.95rem}
.lvl:disabled{opacity:.45;cursor:default}
.lvl.next{outline:4px solid var(--sun);outline-offset:2px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* round */
.where{margin:0;text-align:center;color:var(--muted);font-weight:600}
.path{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}
.stone{width:36px;height:36px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:1.05rem;font-style:normal}
.stone.star{background:var(--soft)} .stone.ok{background:var(--done)}
.stone.here{background:var(--card);outline:3px solid var(--fw);font-size:1.6rem;animation:hop .45s}
.goal{font-size:1.7rem;font-style:normal}
@keyframes hop{40%{transform:translateY(-10px)}}
.eq{direction:ltr;display:flex;justify-content:center;align-items:center;gap:.3em;font:700 clamp(2rem,10vw,3.2rem) var(--display);font-variant-numeric:tabular-nums}
.eq .op{color:var(--fw)} .eq .op.back{color:var(--bw)}
.ans{min-width:1.7em;padding:0 .15em;border-radius:16px;border:4px dashed var(--fw);text-align:center;line-height:1.2;color:var(--muted)}
.ans.right{border-style:solid;border-color:var(--ok);color:var(--ok);animation:pop .35s}
.pond{position:relative;border-radius:20px;background:linear-gradient(transparent 55%,#dff3fb 55%);overflow:hidden}
.pond svg{display:block;width:100%;height:auto}
.ax{stroke:var(--water);stroke-width:3;stroke-linecap:round}
.tk{stroke:var(--water);stroke-width:1.5} .tk.big{stroke-width:2.5}
.lb{font:600 14px var(--display);fill:var(--ink);text-anchor:middle}
.tl{font:700 15px var(--display);fill:var(--pad);text-anchor:middle}
.sl{font:600 13px var(--display);fill:var(--muted);text-anchor:middle}
.st{fill:var(--muted)}
.lotus{font-size:24px;text-anchor:middle}
.arc{fill:none;stroke-width:3;stroke-linecap:round} .arc.fw{stroke:var(--fw)} .arc.bw{stroke:var(--bw)}
.arc.new{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.al{font:700 13px var(--display);text-anchor:middle} .al.fw{fill:var(--fw)} .al.bw{fill:var(--bw)}
.frog{position:absolute;top:70%;transform:translate(-50%,-100%);transition:left .3s ease-out;display:grid;justify-items:center;pointer-events:none}
.frog b{font:700 1rem var(--display);background:var(--ink);color:#fff;border-radius:10px;padding:1px 8px;font-variant-numeric:tabular-nums}
.frog span{font-size:2.2rem;line-height:1;margin-bottom:-4px}
.frog.jump span{animation:jumpy .3s ease-out}
@keyframes jumpy{50%{transform:translateY(-26px)}}
.count{margin:0;text-align:center;font-weight:700;font-size:1.1rem}
.jumps{direction:ltr;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.jb{min-width:66px;font:700 1.7rem var(--display);padding:12px 10px;border-radius:20px;border:0;color:#fff;box-shadow:0 5px 0 rgba(31,58,46,.25)}
.jb.fw{background:var(--fw)} .jb.bw{background:var(--bw)}
.jb:disabled{opacity:.35;cursor:default}
.choices{direction:ltr;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.choices button{width:84px;height:72px;border-radius:20px;border:0;font:700 1.8rem var(--display);background:var(--key);box-shadow:0 5px 0 var(--line)}
.choices .right{background:var(--done);animation:pop .35s} .choices .oops{background:var(--soft);opacity:.6;animation:wobble .4s}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes wobble{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.say{display:flex;align-items:center;gap:10px;min-height:58px;background:var(--key);border-radius:18px;padding:6px 12px}
.say .face{font-size:2.4rem;line-height:1}
.say p{margin:0;flex:1;min-width:0;font:600 1.15rem var(--display)}
.tools{display:flex;justify-content:center;gap:10px}
.tool{font:600 1.05rem var(--display);background:none;border:2px solid var(--line);border-radius:14px;padding:8px 14px}

/* end + album */
.end{display:grid;gap:12px;justify-items:center;text-align:center}
.end p{margin:0;font:600 1.2rem var(--display)}
.gift{font-size:6.5rem;line-height:1.1}
.gift.shake{animation:wobble .5s 2} .gift.pop{animation:pop .5s}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{font:700 1.2rem var(--display);padding:14px 20px;border-radius:18px;border:0;background:var(--key);box-shadow:0 5px 0 var(--line)}
.btn.main{background:var(--fw);color:#fff}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.album span{aspect-ratio:1;display:grid;place-items:center;font-size:2.2rem;border-radius:16px;background:var(--key)}
.album .empty{font:700 1.5rem var(--display);color:var(--shadow)}

#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#fx span{position:absolute;top:-50px;animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(300deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="fx" aria-hidden="true"></div>
<main dir="rtl">
  <header>
    <button class="icon" id="homeBtn" data-go="home" aria-label="הביתה" hidden>🏠</button>
    <h1>קפיצות הצפרדע</h1>
    <button class="icon" id="mute" aria-label="צלילים">🔊</button>
  </header>

  <section id="home" class="stack">
    <div class="hero"><span class="buddy" id="face"></span><p class="bubble">קפצי איתי על קו המספרים! 🪷</p></div>
    <div class="modes">
      <button class="mode m-map" data-go="map"><span class="em">🗺️</span><b>מסע הקפיצות</b><small>חיבור וחיסור עד 100</small></button>
      <button class="mode m-album" data-go="album"><span class="em">📒</span><b>האלבום שלי</b><small id="albumTxt"></small></button>
    </div>
    <p class="label">מי קופץ היום?</p>
    <div class="buddies" id="buddies"></div>
  </section>

  <section id="map" class="stack" hidden>
    <h2>מסע הקפיצות</h2>
    <p class="sub">כל שלב שמסיימים פותח את הבא ונותן מדבקה 🎁</p>
    <div class="levels" id="levels"></div>
  </section>

  <section id="round" class="stack" hidden>
    <p class="where" id="where"></p>
    <div class="path" id="path"></div>
    <div class="eq" id="eq" aria-live="polite"></div>
    <div class="pond"><svg id="line" viewBox="0 0 400 150" aria-hidden="true"></svg><div class="frog" id="frog"><b id="pos"></b><span id="frogFace"></span></div></div>
    <p class="count" id="count"></p>
    <div class="jumps" id="jumps"></div>
    <div class="choices" id="choices" hidden></div>
    <div class="say"><span class="face" id="face2"></span><p id="msg" aria-live="polite"></p></div>
    <div class="tools"><button class="tool" id="undo">↩️ בטלי קפיצה</button><button class="tool" id="skip">🙈 דלגי</button></div>
  </section>

  <section id="end" class="end" hidden>
    <div class="gift" id="gift">🎁</div>
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <p id="endSticker"></p>
    <div class="row">
      <button class="btn main" id="endNext"></button>
      <button class="btn" id="endAgain">עוד פעם 🔁</button>
      <button class="btn" data-go="home">🏠 הביתה</button>
    </div>
  </section>

  <section id="album" class="stack" hidden>
    <h2 id="albumHead"></h2>
    <p class="sub">כל שלב שמסיימים נותן מדבקה</p>
    <div class="album" id="albumGrid"></div>
  </section>
</main>

<script>
// ---- math (pure, no DOM) ----
const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pick = arr => arr[rnd(0, arr.length - 1)];
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rnd(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const notRound = (lo, hi, unit = 1) => { let d; do d = rnd(lo, hi); while (d % 10 === 0); return d * unit; }; // never a whole ten

// fewest jumps from s to t inside the window (breadth-first), returned big jumps first
function shortest(s, t, steps, lo, hi) {
  const prev = new Map([[s, null]]), queue = [s];
  for (let i = 0; i < queue.length && !prev.has(t); i++)
    for (const st of steps) { const n = queue[i] + st; if (n >= lo && n <= hi && !prev.has(n)) { prev.set(n, [queue[i], st]); queue.push(n); } }
  const path = []; for (let p = t; prev.get(p); p = prev.get(p)[0]) path.push(prev.get(p)[1]);
  return path.sort((a, b) => Math.abs(b) - Math.abs(a) || b - a);
}

// the window is fixed per question: one big jump of room on each side, so "jump past, then back" always fits
function make(L, easy) {
  const big = Math.max(...L.steps.map(Math.abs)), max = L.max || 100;
  const q = {mode: L.mode, steps: L.steps, ask: !!L.ask, big, max, ...L.gen(easy)};
  const a = Math.min(q.s, q.t), b = Math.max(q.s, q.t);
  q.lo = Math.max(0, Math.floor(a / big) * big - big);
  q.hi = Math.min(max, Math.ceil(b / big) * big + big);
  q.best = shortest(q.s, q.t, q.steps, q.lo, q.hi);
  return q;
}

const LEVELS = [
  {name: 'קפיצות של 10', em: '🔟', steps: [10], mode: 'reach',
    gen: e => { const s = notRound(1, e ? 19 : 39); return {s, t: s + 10 * rnd(e ? 1 : 2, e ? 3 : 6)}; }},
  {name: 'עשרות ואחדות', em: '🐸', steps: [10, 1], mode: 'reach',
    gen: e => { const d = notRound(11, e ? 25 : 48), s = rnd(2, 99 - d); return {s, t: s + d}; }},
  {name: 'כמה קפצת?', em: '🤔', steps: [10, 1], mode: 'reach', ask: true,
    gen: e => { const d = notRound(11, e ? 25 : 48), s = rnd(2, 99 - d); return {s, t: s + d}; }},
  {name: 'קופצים אחורה', em: '🔙', steps: [-10, -1], mode: 'reach',
    gen: e => { const d = notRound(11, e ? 25 : 38), s = rnd(d + 1, 99); return {s, t: s - d}; }},
  {name: 'חיבור בקפיצות', em: '➕', steps: [10, 1], mode: 'add',
    gen: e => { const b = notRound(11, e ? 19 : 39), s = rnd(10, 99 - b); return {s, t: s + b}; }},
  {name: 'חיסור בקפיצות', em: '➖', steps: [-10, -1], mode: 'sub',
    gen: e => { const b = notRound(11, e ? 19 : 34), s = rnd(b + 5, 99); return {s, t: s - b}; }},
  // +29 is quicker as +30 −1: ones digit 7–9, with room for the extra ten
  {name: 'קפיצה חכמה', em: '💡', steps: [10, 1, -1, -10], mode: 'add',
    gen: e => {
      const o = pick([7, 8, 9]), b = 10 * rnd(1, e ? 1 : 3) + o, up = b - o + 10;
      if (Math.random() < .5) { const s = rnd(10, 100 - up); return {s, t: s + b}; }
      const s = rnd(up, 99); return {s, t: s - b, mode: 'sub'};
    }},
  {name: 'קפיצות של 100', em: '💯', steps: [100, 10], mode: 'reach', max: 1000,
    gen: e => { const d = notRound(11, e ? 25 : 48, 10), s = 10 * rnd(1, (990 - d) / 10); return {s, t: s + d}; }},
];

// ---- ui ----
const $ = id => document.getElementById(id);
const SCREENS = ['home', 'map', 'round', 'end', 'album'];
const BUDDIES = ['🐸', '🐰', '🦘', '🐿️', '🐱', '🐶', '🦄', '🐵'];
const STICKERS = ['🪷', '🐸', '🦆', '🐢', '🐟', '🐠', '🦋', '🐞', '🐝', '🌸', '🌼', '🌻', '🍀', '🌈', '⭐', '🌙', '☀️', '🦢', '🐌', '🦎', '🦩', '🐳', '🐬', '🦀', '🐙', '🍄', '🌺', '🎈', '🪁', '👑'];
const PRAISE = ['כל הכבוד!', 'מעולה!', 'את אלופה!', 'וואו!', 'יופי!', 'נכון מאוד!', 'איזו קפיצה!', 'איזו חכמה!'];
const SOUNDS = {tap: [[600, 0, .06]], hop: [[520, 0, .06], [780, .04, .08]], big: [[392, 0, .08], [784, .06, .14]],
  yay: [[660, 0, .12], [880, .09, .12], [1320, .18, .25]], win: [[523, 0, .18], [659, .15, .18], [784, .3, .18], [1047, .45, .5]]};
const KEY = 'kfitzot-hatsfardea-2';
const DEF = {buddy: '🐸', stars: [], stickers: [], muted: false};
let S; try { S = {...DEF, ...JSON.parse(localStorage.getItem(KEY) || '{}')}; } catch { S = {...DEF}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
let R = null, last = null, locked = false, ac;

const ltr = s => `<span class="mx">${s}</span>`; // keeps "+10" and "34 + 27" left-to-right inside Hebrew
const sg = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
const jumpsHe = n => n === 1 ? 'קפיצה אחת' : `${n} קפיצות`;
const say = h => { $('msg').innerHTML = h; };
const later = (fn, ms) => { const r = R; setTimeout(() => R === r && fn(), ms); }; // dropped if she left the round
const X0 = 26, X1 = 374, Y = 105;
const xAt = v => X0 + (v - R.q.lo) / (R.q.hi - R.q.lo) * (X1 - X0);
// "4 קפיצות של +10 ו-2 של −1"
function bestHe(best) {
  const groups = [];
  for (const st of best) { const g = groups.at(-1); if (g && g[0] === st) g[1]++; else groups.push([st, 1]); }
  return groups.map(([st, n], i) => i ? `${n === 1 ? 'ואחת' : `ו-${n}`} של ${ltr(sg(st))}` : `${jumpsHe(n)} של ${ltr(sg(st))}`).join(' ');
}

function sound(name) {
  if (S.muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime;
    for (const [f, at, dur] of SOUNDS[name]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0 + at);
      g.gain.exponentialRampToValueAtTime(.2, t0 + at + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + at + dur);
      o.connect(g).connect(ac.destination); o.start(t0 + at); o.stop(t0 + at + dur + .05);
    }
  } catch {}
}

function burst(big) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < (big ? 40 : 14); i++) {
    const s = document.createElement('span');
    s.textContent = pick(['⭐', '✨', '🪷', '💚', '🌟']);
    s.style.left = rnd(3, 95) + '%'; s.style.fontSize = rnd(18, 36) + 'px'; s.style.animationDelay = rnd(0, 350) + 'ms';
    $('fx').append(s); setTimeout(() => s.remove(), 2000);
  }
}

function show(id) {
  for (const s of SCREENS) $(s).hidden = s !== id;
  $('homeBtn').hidden = id === 'home';
  ({home: drawHome, map: drawMap, album: drawAlbum})[id]?.();
}

function drawHome() {
  $('face').textContent = S.buddy;
  $('buddies').innerHTML = BUDDIES.map(b => `<button aria-pressed="${b === S.buddy}" aria-label="חבר ${b}">${b}</button>`).join('');
  $('albumTxt').textContent = `${S.stickers.length} מדבקות`;
}

function drawMap() {
  const nextI = LEVELS.findIndex((_, i) => !S.stars[i]);
  $('levels').innerHTML = LEVELS.map((l, i) => {
    const open = i === 0 || S.stars[i - 1];
    return `<button class="lvl${i === nextI ? ' next' : ''}" data-l="${i}"${open ? '' : ' disabled'}>
      <span class="num">${open ? l.em : '🔒'}</span><span class="nm">${i + 1}. ${l.name}</span><span class="st">${'⭐'.repeat(S.stars[i] || 0)}</span></button>`;
  }).join('');
}

function drawAlbum() {
  $('albumHead').textContent = `האלבום שלי · ${S.stickers.length} מתוך ${STICKERS.length}`;
  $('albumGrid').innerHTML = STICKERS.map(s => S.stickers.includes(s) ? `<span>${s}</span>` : '<span class="empty">?</span>').join('');
}

function startLevel(i) {
  R = {lvl: i, total: 6, n: 0, results: [], missRun: 0, streak: 0, easy: false};
  last = i;
  $('where').textContent = `שלב ${i + 1} · ${LEVELS[i].name}`; $('face2').textContent = $('frogFace').textContent = S.buddy;
  show('round'); next();
}

function next() {
  if (R.n >= R.total) return finish();
  const easy = R.easy || R.missRun >= 2; // two tough ones in a row (or a skip): an easier one
  if (R.missRun >= 2) R.missRun = 0;
  R.easy = false;
  const q = make(LEVELS[R.lvl], easy);
  Object.assign(R, {q, pos: q.s, jumps: [], tries: 0, revealed: false});
  locked = false; drawPath();
  $('jumps').hidden = false; $('choices').hidden = true; $('undo').hidden = false;
  $('jumps').innerHTML = [...q.steps].sort((a, b) => a - b).map(st => `<button class="jb ${st > 0 ? 'fw' : 'bw'}" data-s="${st}">${sg(st)}</button>`).join('');
  const b = Math.abs(q.t - q.s), fw = q.t > q.s;
  R.intro = q.mode === 'reach' ? `קפצי מ-${q.s} עד 🪷 ${q.t}${q.steps.length === 1 ? ' · כל קפיצה היא 10' : ''}`
    : `קפצי ${b} ${fw ? 'קדימה' : 'אחורה'} מ-${q.s}. איפה תנחתי?${q.steps.length === 4 ? ' נסי במעט קפיצות 💡' : ''}`;
  say(R.intro);
  showEq(false); drawPond(false);
}

function drawPath() {
  $('path').innerHTML = Array.from({length: R.total}, (_, i) => {
    const r = R.results[i];
    return i === R.n ? `<i class="stone here">${S.buddy}</i>` : `<i class="stone ${r || ''}">${{star: '⭐', ok: '✓'}[r] || ''}</i>`;
  }).join('') + `<i class="goal">${R.n >= R.total ? S.buddy : '🎁'}</i>`;
}

// the question on top; the answer box fills in once she lands
function showEq(solved) {
  const q = R.q, d = Math.abs(q.t - q.s), fw = q.t > q.s, op = `<span class="op${fw ? '' : ' back'}">${fw ? '+' : '−'}</span>`;
  const box = v => `<span class="ans${solved ? ' right' : ''}">${solved ? v : '?'}</span>`;
  if (q.mode !== 'reach') return $('eq').innerHTML = `<span>${q.s}</span>${op}<span>${d}</span><span>=</span>${box(q.t)}`;
  if (q.ask && solved) return $('eq').innerHTML = `<span>${Math.max(q.s, q.t)}</span><span class="op back">−</span><span>${Math.min(q.s, q.t)}</span><span>=</span>${box(d)}`;
  if (solved) return $('eq').innerHTML = `<span>${q.s}</span>${op}<span>${d}</span><span>=</span><span class="ans right">${q.t}</span>`;
  $('eq').innerHTML = fw ? `<span>${q.s}</span><span class="op">⟶</span><span>🪷${q.t}</span>` : `<span>🪷${q.t}</span><span class="op back">⟵</span><span>${q.s}</span>`;
}

function drawPond(animate) {
  const q = R.q, unit = q.max === 1000 ? 10 : 1, tenth = unit * 10;
  let h = `<line x1="${X0 - 12}" y1="${Y}" x2="${X1 + 12}" y2="${Y}" class="ax"/>`;
  for (let v = q.lo; v <= q.hi; v += unit) {
    const len = v % tenth === 0 ? 10 : v % (tenth / 2) === 0 ? 7 : 4, x = xAt(v).toFixed(1);
    h += `<line x1="${x}" y1="${Y - len}" x2="${x}" y2="${Y + len}" class="tk${len === 10 ? ' big' : ''}"/>`;
    if (len === 10) h += `<text x="${x}" y="${Y + 27}" class="lb">${v}</text>`;
  }
  h += `<circle cx="${xAt(q.s)}" cy="${Y}" r="5" class="st"/><text x="${xAt(q.s)}" y="${Y + 44}" class="sl">${q.s}</text>`;
  if (q.mode === 'reach') h += `<text x="${xAt(q.t)}" y="${Y + 8}" class="lotus">🪷</text><text x="${xAt(q.t)}" y="${Y + 44}" class="tl">${q.t}</text>`;
  let p = q.s;
  R.jumps.forEach((st, i) => {
    const n = p + st, x1 = xAt(p), x2 = xAt(n), tall = Math.abs(st) === q.big ? 50 : 20, mid = (x1 + x2) / 2, dir = st > 0 ? 'fw' : 'bw';
    h += `<path d="M${x1} ${Y} Q${mid} ${Y - 2 * tall} ${x2} ${Y}" class="arc ${dir}${animate && i === R.jumps.length - 1 ? ' new' : ''}" pathLength="1"/>`;
    if (tall === 50) h += `<text x="${mid}" y="${Y - tall - 5}" class="al ${dir}">${sg(st)}</text>`;
    p = n;
  });
  $('line').innerHTML = h;
  const f = $('frog');
  f.style.left = (xAt(R.pos) / 400 * 100) + '%';
  $('pos').textContent = R.pos;
  if (animate) { f.classList.remove('jump'); void f.offsetWidth; f.classList.add('jump'); }
  for (const b of $('jumps').children) { const n = R.pos + +b.dataset.s; b.disabled = locked || n < q.lo || n > q.hi; }
  $('undo').disabled = locked || !R.jumps.length;
  drawCount();
}

function drawCount() {
  const q = R.q, moved = R.pos - q.s, n = R.jumps.length;
  if (q.ask && !R.revealed) $('count').textContent = jumpsHe(n); // the distance is the question here
  else if (q.mode === 'reach') $('count').innerHTML = `קפצת ${ltr(sg(moved) || '0')} · ${jumpsHe(n)}`;
  else $('count').innerHTML = `קפצת ${ltr(sg(moved) || '0')} מתוך ${ltr(sg(q.t - q.s))}`;
}

function jump(st) {
  if (!R || locked) return;
  const q = R.q, n = R.pos + st;
  if (n < q.lo || n > q.hi) return;
  R.jumps.push(st); R.pos = n;
  sound(Math.abs(st) === q.big ? 'big' : 'hop');
  if (n === q.t) { locked = true; drawPond(true); return land(); }
  drawPond(true); coach();
}

// kind nudges only: overshoot, many small hops, or the "past and back" trick
function coach() {
  const q = R.q, dir = Math.sign(q.t - q.s), left = (q.t - R.pos) * dir;
  const canBack = q.steps.some(st => Math.sign(st) === -dir);
  if (left < 0) return say(canBack ? 'עכשיו קפצי קצת אחורה 👌' : `אופס, ${q.mode === 'reach' ? 'עברת את 🪷' : `קפצת יותר מ-${Math.abs(q.t - q.s)}`}! לחצי ↩️ כדי לבטל קפיצה`);
  let smalls = 0; for (let i = R.jumps.length - 1; i >= 0 && R.jumps[i] === dir * q.big / 10; i--) smalls++;
  if (smalls >= 2 && canBack && left / (q.big / 10) % 10 >= 6) return say(`טיפ: אפשר לקפוץ ${q.big} ואז לחזור קצת אחורה 💡`);
  if (smalls >= 4 && left >= q.big) return say(`טיפ: קפיצה של ${q.big} מגיעה מהר יותר! 🚀`);
  say(R.intro);
}

function undo() {
  if (!R || locked || !R.jumps.length) return;
  R.pos -= R.jumps.pop(); drawPond(false); say(R.intro); sound('tap');
}

function land() {
  const q = R.q, n = R.jumps.length, min = q.best.length;
  later(() => {
    if (q.ask) return showChoices();
    showEq(true);
    const star = n <= min;
    say(star ? `${pick(PRAISE)} ${n === 1 ? 'בקפיצה אחת' : `רק ${n} קפיצות`}! ⭐` : `הגעת! 🎉 אפשר גם ב-${jumpsHe(min)}: ${bestHe(q.best)}`);
    sound('yay'); burst(star);
    done(star ? 'star' : 'ok', star ? 2000 : 4000);
  }, 380);
}

function showChoices() {
  const q = R.q, d = Math.abs(q.t - q.s);
  const near = shuffle([d + 10, d - 10, d + 1, d - 1].filter(v => v > 0)).slice(0, 2);
  locked = false; // jumping is over (buttons hidden); now the answer buttons take taps
  $('jumps').hidden = true; $('undo').hidden = true; $('choices').hidden = false;
  $('choices').innerHTML = shuffle([d, ...near]).map(v => `<button data-v="${v}">${v}</button>`).join('');
  say('כמה קפצת בסך הכל? 🤔 ספרי את הקשתות');
}

function choose(b) {
  const q = R.q, d = Math.abs(q.t - q.s), v = +b.dataset.v;
  if (v === d) {
    b.className = 'right'; locked = true; R.revealed = true; showEq(true); drawCount();
    const first = R.tries === 0;
    say(`${first ? pick(PRAISE) : 'נכון!'} קפצת ${d}: ${bestHe(q.best)}`);
    sound('yay'); burst(first);
    return done(first ? 'star' : 'ok', 3000);
  }
  b.className = 'oops'; b.disabled = true;
  if (++R.tries < 2) return say(`כל קשת גדולה היא ${q.big}, כל קשת קטנה היא ${q.big / 10}. נסי שוב 🙂`);
  locked = true; R.revealed = true; showEq(true); drawCount();
  for (const c of $('choices').children) if (+c.dataset.v === d) c.className = 'right';
  say(`קפצת ${d}: ${bestHe(q.best)} 👀 ממשיכים!`);
  done('ok', 3800);
}

function done(result, ms) {
  locked = true; R.results.push(result);
  R.missRun = result === 'star' ? 0 : R.missRun + 1;
  R.n++; drawPath(); later(next, ms);
}

function giveSticker() {
  const left = STICKERS.filter(s => !S.stickers.includes(s));
  const s = pick(left.length ? left : STICKERS);
  if (left.length) S.stickers.push(s);
  return {s, isNew: left.length > 0};
}

function finish() {
  const r = R; R = null;
  const stars = r.results.filter(x => x === 'star').length;
  S.stars[r.lvl] = Math.max(S.stars[r.lvl] || 0, stars >= r.total - 1 ? 3 : stars >= r.total / 2 ? 2 : 1);
  const st = giveSticker(); save();
  $('endTitle').textContent = `סיימת את שלב ${r.lvl + 1}! 🎉`;
  $('endText').textContent = stars ? `אספת ${'⭐'.repeat(stars)}` : 'הגעת עד הסוף!';
  $('endSticker').textContent = '';
  const nextLvl = r.lvl < LEVELS.length - 1;
  $('endNext').hidden = !nextLvl; $('endNext').textContent = nextLvl ? `לשלב ${r.lvl + 2} ⬅️` : '';
  const g = $('gift'); g.textContent = '🎁'; g.className = 'gift shake';
  show('end');
  setTimeout(() => {
    g.textContent = st.s; g.className = 'gift pop';
    $('endSticker').textContent = st.isNew ? 'מדבקה חדשה לאלבום! 📒' : 'עוד מדבקה בשבילך!';
    sound('win'); burst(true);
  }, 1100);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  R = null; show(b.dataset.go);
});
$('jumps').onclick = e => { const b = e.target.closest('button'); if (b && !b.disabled) jump(+b.dataset.s); };
$('choices').onclick = e => { const b = e.target.closest('button'); if (b && R && !locked && !b.disabled) choose(b); };
$('undo').onclick = undo;
$('levels').onclick = e => { const b = e.target.closest('button'); if (b && !b.disabled) startLevel(+b.dataset.l); };
$('buddies').onclick = e => { const b = e.target.closest('button'); if (b) { S.buddy = b.textContent; save(); drawHome(); sound('tap'); } };
// skip swaps in a new, easier question on the same step, so stickers still need real answers
$('skip').onclick = () => { if (R && !locked) { R.easy = true; next(); } };
$('endNext').onclick = () => startLevel(last + 1);
$('endAgain').onclick = () => startLevel(last);
$('mute').onclick = () => { S.muted = !S.muted; save(); $('mute').textContent = S.muted ? '🔇' : '🔊'; };
$('mute').textContent = S.muted ? '🔇' : '🔊';
show('home');
</script>
</html>
