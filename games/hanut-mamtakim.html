<!doctype html>
<html lang="he">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חנות הממתקים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;600;800&display=swap">
<style>
/* layout: one rounded shop card on candy stripes; screens (home, map, round, end, album) swap inside it */
:root{
  --bg:#ffd6e5; --stripe:#ffe8f0; --card:#fffdf8; --ink:#3a2440; --muted:#7a6680; --line:#f1dbe6; --key:#fff0f5; --shadow:#e7a6c0;
  --berry:#e2457a; --mint:#1f9d7c; --sun:#ffc531; --soft:#fff3c4; --ok:#1a9d5c; --done:#d3f0e0; --sky:#2f86d0;
  --silver:#dfe4ea; --silver2:#a3acb8; --gold:#f0c548; --gold2:#c99a1c; --n20:#f3a196; --n50:#94d4a6; --n100:#f7c272;
  --display:"Fredoka","Rubik",system-ui,"Arial Hebrew",sans-serif; --body:"Rubik",system-ui,"Arial Hebrew",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:repeating-linear-gradient(135deg,var(--bg) 0 28px,var(--stripe) 28px 56px);color:var(--ink);font-family:var(--body);font-size:16px;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
main{max-width:560px;margin:0 auto;background:var(--card);border-radius:28px;padding:18px;display:grid;gap:14px;box-shadow:0 8px 0 var(--shadow)}
.stack{display:grid;gap:14px}
h1,h2{margin:0;font-family:var(--display);text-align:center;text-wrap:balance}
h1{flex:1;font-size:1.7rem;font-weight:700} h2{font-size:1.5rem}
.sub{margin:0;text-align:center;color:var(--muted)}
header{display:flex;align-items:center;gap:8px}
.icon{font-size:1.4rem;width:48px;height:48px;border-radius:14px;border:0;background:var(--key);box-shadow:0 4px 0 var(--line)}
.icon:active,.btn:active,.lvl:active,.mode:active,.purse:active,.yn button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mx{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap}

/* home */
.awning{height:22px;margin:-18px -18px 0;border-radius:28px 28px 0 0;background:repeating-linear-gradient(90deg,var(--berry) 0 34px,#fff 34px 68px)}
.hero{display:flex;align-items:center;justify-content:center;gap:12px}
.buddy{font-size:4.2rem;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.bubble{margin:0;background:var(--key);border-radius:18px;padding:10px 16px;font:600 1.2rem var(--display)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:grid;gap:2px;justify-items:center;padding:16px 8px;border-radius:22px;border:0;color:#fff;box-shadow:0 6px 0 rgba(58,36,64,.22)}
.mode .em{font-size:2.3rem;line-height:1.2} .mode b{font:700 1.3rem var(--display)} .mode small{font-size:.92rem;font-weight:600}
.m-map{background:var(--berry)} .m-album{background:var(--mint)}
.label{margin:0;text-align:center;font-weight:600;color:var(--muted)}
.buddies{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.buddies button{font-size:1.8rem;width:54px;height:54px;border-radius:50%;border:3px solid transparent;background:var(--key)}
.buddies button[aria-pressed="true"]{border-color:var(--sun);background:var(--soft)}

/* level map */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.lvl{display:grid;justify-items:center;gap:4px;padding:12px 6px;border-radius:20px;border:0;background:var(--key);box-shadow:0 5px 0 var(--line)}
.lvl .num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:var(--soft)}
.lvl .nm{font-weight:600;font-size:.95rem;text-align:center}
.lvl .st{min-height:1.3em;font-size:.95rem}
.lvl:disabled{opacity:.45;cursor:default}
.lvl.next{outline:4px solid var(--sun);outline-offset:2px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* round */
.where{margin:0;text-align:center;color:var(--muted);font-weight:600}
.path{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}
.stone{width:36px;height:36px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:1.05rem;font-style:normal}
.stone.star{background:var(--soft)} .stone.ok{background:var(--done)}
.stone.here{background:var(--card);outline:3px solid var(--berry);font-size:1.6rem;animation:hop .45s}
.goal{font-size:1.7rem;font-style:normal}
@keyframes hop{40%{transform:translateY(-10px)}}
.shelf{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:12px}
.item{display:grid;justify-items:center;gap:2px;min-width:104px;padding:10px 12px;border-radius:20px;background:var(--key);border:3px solid var(--line)}
.item .em{font-size:3.2rem;line-height:1.1}
.item small{font-weight:600;color:var(--muted)}
.tag{font:700 1.5rem var(--display);background:var(--soft);border-radius:10px;padding:0 10px}
.task{margin:0;text-align:center;font:700 1.35rem/1.35 var(--display);text-wrap:balance}
.counter{border-radius:20px;background:#fbeee0;border:3px dashed #e3c7a8;padding:10px;display:grid;gap:8px}
.ctop{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}
.sum{font:700 1.4rem var(--display)}
.pieces{direction:ltr;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;min-height:58px}
.empty-hint{color:var(--muted);font-weight:600;direction:rtl}
.wallet{direction:ltr;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}

/* money: generic coins and notes, sized by value */
.m{display:inline-grid;place-items:center;align-content:center;border:0;padding:0;font-family:var(--display);line-height:1;color:var(--ink);flex:none}
.m b{font-size:1.15rem;font-weight:700} .m small{font-size:.7rem;font-weight:700}
.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--silver) 45%,var(--silver2));box-shadow:inset 0 0 0 3px var(--silver2),0 3px 0 rgba(58,36,64,.18)}
.c1{width:40px;height:40px} .c2{width:44px;height:44px} .c5{width:50px;height:50px}
.c10{width:54px;height:54px;background:radial-gradient(circle at 35% 30%,#fff6cf,var(--gold) 45%,var(--gold2) 62%,var(--silver) 64%,var(--silver2));box-shadow:inset 0 0 0 3px var(--silver2),0 3px 0 rgba(58,36,64,.18)}
.note{width:78px;height:44px;border-radius:7px;grid-auto-flow:column;gap:3px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 3px 0 rgba(58,36,64,.18)}
.note b{font-size:1.3rem}
.n20{background:var(--n20)} .n50{background:var(--n50)} .n100{background:var(--n100)}
button.m:active{transform:translateY(3px)}
.pieces .m{animation:drop .25s ease-out}
@keyframes drop{from{transform:translateY(-14px);opacity:.4}}
.purses{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.purse{display:grid;justify-items:center;gap:8px;padding:12px 8px;border-radius:22px;border:3px solid var(--line);background:var(--key);box-shadow:0 5px 0 var(--line)}
.purse .who{font-size:2.6rem;line-height:1}
.purse .pieces{min-height:0}
.purse .m{transform:scale(.82);margin:-3px}
.purse .tot{font:700 1.4rem var(--display);background:var(--soft);border-radius:10px;padding:0 10px}
.purse.right{border-color:var(--ok);animation:pop .35s} .purse.oops{border-color:var(--sun);animation:wobble .4s}
.cash{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;font-weight:700}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn button{font:700 1.25rem var(--display);padding:16px 8px;border-radius:20px;border:0;background:var(--key);box-shadow:0 5px 0 var(--line)}
.yn button.right{background:var(--done);animation:pop .35s} .yn button.oops{background:var(--soft);animation:wobble .4s}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes wobble{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.say{display:flex;align-items:center;gap:10px;min-height:58px;background:var(--key);border-radius:18px;padding:6px 12px}
.say .face{font-size:2.4rem;line-height:1}
.say p{margin:0;flex:1;min-width:0;font:600 1.15rem var(--display)}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tool{font:600 1.05rem var(--display);background:none;border:2px solid var(--line);border-radius:14px;padding:8px 14px}

/* end + album */
.end{display:grid;gap:12px;justify-items:center;text-align:center}
.end p{margin:0;font:600 1.2rem var(--display)}
.gift{font-size:6.5rem;line-height:1.1}
.gift.shake{animation:wobble .5s 2} .gift.pop{animation:pop .5s}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{font:700 1.2rem var(--display);padding:14px 20px;border-radius:18px;border:0;background:var(--key);box-shadow:0 5px 0 var(--line)}
.btn.main{background:var(--berry);color:#fff}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.album span{aspect-ratio:1;display:grid;place-items:center;font-size:2.2rem;border-radius:16px;background:var(--key)}
.album .empty{font:700 1.5rem var(--display);color:var(--shadow)}

#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#fx span{position:absolute;top:-50px;animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(300deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

<div id="fx" aria-hidden="true"></div>
<main dir="rtl">
  <div class="awning" aria-hidden="true"></div>
  <header>
    <button class="icon" id="homeBtn" data-go="home" aria-label="הביתה" hidden>🏠</button>
    <h1>חנות הממתקים</h1>
    <button class="icon" id="mute" aria-label="צלילים">🔊</button>
  </header>

  <section id="home" class="stack">
    <div class="hero"><span class="buddy" id="face"></span><p class="bubble">ברוכה הבאה לחנות! 🍭</p></div>
    <div class="modes">
      <button class="mode m-map" data-go="map"><span class="em">🛒</span><b>לחנות</b><small>משלמים, סופרים ונותנים עודף</small></button>
      <button class="mode m-album" data-go="album"><span class="em">📒</span><b>האלבום שלי</b><small id="albumTxt"></small></button>
    </div>
    <p class="label">מי עובד איתך בחנות?</p>
    <div class="buddies" id="buddies"></div>
  </section>

  <section id="map" class="stack" hidden>
    <h2>המדפים של החנות</h2>
    <p class="sub">כל שלב שמסיימים פותח את הבא ונותן מדבקה 🎁</p>
    <div class="levels" id="levels"></div>
  </section>

  <section id="round" class="stack" hidden>
    <p class="where" id="where"></p>
    <div class="path" id="path"></div>
    <div class="shelf" id="shelf"></div>
    <p class="task" id="task"></p>
    <div id="payArea" class="stack">
      <div class="counter">
        <div class="ctop"><span id="counterName"></span><span class="sum" id="sum"></span></div>
        <div class="pieces" id="counter" aria-live="polite"></div>
      </div>
      <div class="wallet" id="wallet"></div>
      <button class="btn main" id="payBtn"></button>
    </div>
    <div class="yn" id="yn" hidden><button data-a="1">כן, יספיק 👍</button><button data-a="0">לא יספיק 👎</button></div>
    <div class="say"><span class="face" id="face2"></span><p id="msg" aria-live="polite"></p></div>
    <div class="tools"><button class="tool" id="peek">💡 כמה שמתי?</button><button class="tool" id="clear">🧹 לנקות</button><button class="tool" id="skip">🙈 דלגי</button></div>
  </section>

  <section id="end" class="end" hidden>
    <div class="gift" id="gift">🎁</div>
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <p id="endSticker"></p>
    <div class="row">
      <button class="btn main" id="endNext"></button>
      <button class="btn" id="endAgain">עוד פעם 🔁</button>
      <button class="btn" data-go="home">🏠 הביתה</button>
    </div>
  </section>

  <section id="album" class="stack" hidden>
    <h2 id="albumHead"></h2>
    <p class="sub">כל שלב שמסיימים נותן מדבקה</p>
    <div class="album" id="albumGrid"></div>
  </section>
</main>

<script>
// ---- math (pure, no DOM) ----
const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pick = arr => arr[rnd(0, arr.length - 1)];
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rnd(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const total = arr => arr.reduce((a, b) => a + b, 0);
const ALL = [1, 2, 5, 10, 20, 50, 100];
const CAP = 20; // pieces on the counter; every answer needs at most 13
// greedy gives the fewest pieces for shekel coins and notes
const fewest = (n, wallet = ALL) => { const out = []; for (const v of [...wallet].sort((a, b) => b - a)) while (n >= v) { out.push(v); n -= v; } return out; };
const ITEMS = [['🍭', 'סוכרייה על מקל'], ['🍫', 'שוקולד'], ['🍩', 'דונאט'], ['🧁', 'קאפקייק'], ['🍪', 'עוגייה'], ['🍦', 'גלידה'],
  ['🍬', 'סוכרייה'], ['🍿', 'פופקורן'], ['🧃', 'מיץ'], ['🍰', 'עוגה'], ['🍮', 'פודינג'], ['🎂', 'עוגת יום הולדת']];
const WHO = ['🐻', '🐰', '🐷', '🐨', '🦁', '🐯', '🐮', '🐹'];
const items = prices => shuffle([...ITEMS]).slice(0, prices.length).map(([em, name], i) => ({em, name, price: prices[i]}));

const buy = (wallet, sum, lo, hi) => easy => {
  const price = rnd(lo, easy ? Math.min(hi, lo + 12) : hi);
  return {kind: 'pay', wallet, sum, items: items([price]), ans: price};
};
function pair(easy) {
  const a = easy ? 10 * rnd(1, 3) : rnd(11, 45), b = easy ? rnd(3, 9) : rnd(11, Math.min(45, 90 - a));
  return {kind: 'pay', wallet: ALL, sum: false, items: items([a, b]), ans: a + b};
}
// one purse has many small coins, the other a few big ones; never a tie
function richer(easy) {
  for (;;) {
    const many = Array.from({length: rnd(5, 8)}, () => pick([1, 1, 2, 2, 5]));
    const few = Array.from({length: rnd(1, 3)}, () => pick(easy ? [10, 20, 50] : [5, 10, 10, 20]));
    if (Math.abs(total(few) - total(many)) < (easy ? 8 : 3)) continue;
    const who = shuffle([...WHO]);
    const purses = shuffle([many, few]).map((c, i) => ({who: who[i], coins: c.sort((x, y) => y - x), total: total(c)}));
    return {kind: 'richer', purses, ans: purses[0].total > purses[1].total ? 0 : 1};
  }
}
// budget is a round amount at least 3 (easy: 8) away from the bill, so it is never a coin-toss
function enough(easy) {
  for (;;) {
    const prices = Array.from({length: easy ? 2 : rnd(2, 3)}, () => easy ? 5 * rnd(2, 6) : rnd(8, 35));
    const bill = total(prices), budget = 10 * Math.round((bill + rnd(-12, 12)) / 10), gap = Math.abs(budget - bill);
    if (budget < 10 || budget > 100 || gap < (easy ? 8 : 3) || gap > 15) continue;
    return {kind: 'enough', items: items(prices), budget, bill, ans: budget >= bill};
  }
}
function change(easy) {
  const given = easy ? pick([10, 20]) : pick([20, 50, 50, 100]);
  const price = easy ? rnd(given - 9, given - 2) : rnd(Math.max(3, given - 45), given - 3);
  return {kind: 'pay', change: true, given, who: pick(WHO), wallet: [1, 2, 5, 10, 20], sum: false, items: items([price]), ans: given - price};
}

const LEVELS = [
  {name: 'עשר ואחד', em: '🪙', make: buy([1, 10], true, 11, 49)},
  {name: 'גם 2 וגם 5', em: '🪙', make: buy([1, 2, 5, 10], true, 12, 60)},
  {name: 'למי יש יותר?', em: '👛', make: richer},
  {name: 'גם שטרות', em: '💵', make: buy(ALL, true, 25, 100)},
  {name: 'סופרת לבד', em: '🤫', make: buy(ALL, false, 15, 95)},
  {name: 'שני ממתקים', em: '🛍️', make: pair},
  {name: 'יספיק לי?', em: '🤔', make: enough},
  {name: 'נותנת עודף', em: '🔁', make: change},
];

// ---- ui ----
const $ = id => document.getElementById(id);
const SCREENS = ['home', 'map', 'round', 'end', 'album'];
const BUDDIES = ['🐰', '🦊', '🐼', '🐱', '🐶', '🦄', '🐸', '🐵'];
const STICKERS = ['🍭', '🍬', '🍫', '🍩', '🧁', '🍪', '🍦', '🍰', '🎂', '🍮', '🍯', '🥧', '🍓', '🍒', '🍉', '🍌', '🍇', '🍑', '🥨', '🧇', '🥞', '🍿', '🧃', '🎈', '🎀', '👑', '🦄', '🌈', '⭐', '🪅'];
const PRAISE = ['כל הכבוד!', 'מעולה!', 'את אלופה!', 'וואו!', 'יופי!', 'נכון מאוד!', 'איזו מוכרת!', 'איזו חכמה!'];
const SOUNDS = {tap: [[600, 0, .06]], coin: [[1320, 0, .07], [1760, .05, .12]], yay: [[660, 0, .12], [880, .09, .12], [1320, .18, .25]], win: [[523, 0, .18], [659, .15, .18], [784, .3, .18], [1047, .45, .5]]};
const KEY = 'hanut-hamamtakim-2';
const DEF = {buddy: '🐰', stars: [], stickers: [], muted: false};
let S; try { S = {...DEF, ...JSON.parse(localStorage.getItem(KEY) || '{}')}; } catch { S = {...DEF}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
let R = null, last = null, locked = false, ac;

const ltr = s => `<span class="mx">${s}</span>`; // keeps "23 + 5 = 28" left-to-right inside Hebrew
const nis = n => `${n} ₪`;
const say = h => { $('msg').innerHTML = h; };
const later = (fn, ms) => { const r = R; setTimeout(() => R === r && fn(), ms); }; // dropped if she left the round
const money = (v, tag = 'span') => `<${tag} class="m ${v >= 20 ? 'note n' + v : 'coin c' + v}" data-v="${v}" aria-label="${v} שקלים"><b>${v}</b><small>₪</small></${tag}>`;
const tensOnes = n => { const t = Math.floor(n / 10), o = n % 10; return `${t === 1 ? 'עשרת אחת' : `${t} עשרות`} ${o === 1 ? 'ויחידה אחת' : `ו-${o} יחידות`}`; };
const coinsHe = n => n === 1 ? 'מטבע אחד' : `${n} מטבעות`;

function sound(name) {
  if (S.muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime;
    for (const [f, at, dur] of SOUNDS[name]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0 + at);
      g.gain.exponentialRampToValueAtTime(.2, t0 + at + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + at + dur);
      o.connect(g).connect(ac.destination); o.start(t0 + at); o.stop(t0 + at + dur + .05);
    }
  } catch {}
}

function burst(big) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < (big ? 40 : 14); i++) {
    const s = document.createElement('span');
    s.textContent = pick(['🍬', '🍭', '✨', '🎉', '💖']);
    s.style.left = rnd(3, 95) + '%'; s.style.fontSize = rnd(18, 36) + 'px'; s.style.animationDelay = rnd(0, 350) + 'ms';
    $('fx').append(s); setTimeout(() => s.remove(), 2000);
  }
}

function show(id) {
  for (const s of SCREENS) $(s).hidden = s !== id;
  $('homeBtn').hidden = id === 'home';
  ({home: drawHome, map: drawMap, album: drawAlbum})[id]?.();
}

function drawHome() {
  $('face').textContent = S.buddy;
  $('buddies').innerHTML = BUDDIES.map(b => `<button aria-pressed="${b === S.buddy}" aria-label="חבר ${b}">${b}</button>`).join('');
  $('albumTxt').textContent = `${S.stickers.length} מדבקות`;
}

function drawMap() {
  const nextI = LEVELS.findIndex((_, i) => !S.stars[i]);
  $('levels').innerHTML = LEVELS.map((l, i) => {
    const open = i === 0 || S.stars[i - 1];
    return `<button class="lvl${i === nextI ? ' next' : ''}" data-l="${i}"${open ? '' : ' disabled'}>
      <span class="num">${open ? l.em : '🔒'}</span><span class="nm">${i + 1}. ${l.name}</span><span class="st">${'⭐'.repeat(S.stars[i] || 0)}</span></button>`;
  }).join('');
}

function drawAlbum() {
  $('albumHead').textContent = `האלבום שלי · ${S.stickers.length} מתוך ${STICKERS.length}`;
  $('albumGrid').innerHTML = STICKERS.map(s => S.stickers.includes(s) ? `<span>${s}</span>` : '<span class="empty">?</span>').join('');
}

function startLevel(i) {
  R = {lvl: i, total: 6, n: 0, results: [], missRun: 0, streak: 0, easy: false};
  last = i;
  $('where').textContent = `שלב ${i + 1} · ${LEVELS[i].name}`; $('face2').textContent = S.buddy;
  show('round'); next();
}

function next() {
  if (R.n >= R.total) return finish();
  const easy = R.easy || R.missRun >= 2; // two tough ones in a row (or a skip): an easier one
  if (R.missRun >= 2) R.missRun = 0;
  R.easy = false;
  const q = LEVELS[R.lvl].make(easy);
  Object.assign(R, {q, tries: 0, paid: [], peek: false});
  locked = false; say(''); drawPath();
  const pay = q.kind === 'pay';
  $('payArea').hidden = !pay; $('yn').hidden = q.kind !== 'enough';
  $('peek').hidden = !pay || q.sum; $('clear').hidden = !pay;
  for (const b of $('yn').children) b.className = '';
  ({pay: showPay, richer: showRicher, enough: showEnough})[q.kind](q);
}

function drawPath() {
  $('path').innerHTML = Array.from({length: R.total}, (_, i) => {
    const r = R.results[i];
    return i === R.n ? `<i class="stone here">${S.buddy}</i>` : `<i class="stone ${r || ''}">${{star: '⭐', ok: '✓'}[r] || ''}</i>`;
  }).join('') + `<i class="goal">${R.n >= R.total ? S.buddy : '🎁'}</i>`;
}

const itemCard = it => `<div class="item"><span class="em">${it.em}</span><span class="tag">${nis(it.price)}</span><small>${it.name}</small></div>`;

function showPay(q) {
  $('shelf').innerHTML = q.items.map(itemCard).join('') + (q.change ? `<div class="item"><span class="em">${q.who}</span>${money(q.given)}<small>נתן לך</small></div>` : '');
  $('task').innerHTML = q.change ? `${q.who} נתן לך ${nis(q.given)}. כמה עודף תחזירי לו?`
    : q.items.length > 1 ? 'כמה עולים שניהם ביחד? שלמי בדיוק!' : `שלמי בדיוק ${nis(q.ans)}`;
  $('counterName').textContent = q.change ? '🤲 העודף שאת נותנת:' : '🧺 על הדלפק:';
  $('payBtn').textContent = q.change ? 'נתתי עודף ✓' : 'שילמתי ✓';
  $('wallet').innerHTML = q.wallet.map(v => money(v, 'button')).join('');
  if (q.change) say('את המוכרת! ספרי מהמחיר עד הסכום שקיבלת 🙂');
  drawCounter();
}

function drawCounter() {
  const paid = [...R.paid].sort((a, b) => b - a);
  $('counter').innerHTML = paid.length ? paid.map(v => money(v, 'button')).join('') : '<span class="empty-hint">לחצי על מטבע או שטר כדי לשים אותו כאן</span>';
  $('sum').textContent = R.q.sum || R.peek ? nis(total(R.paid)) : '? ₪';
}

function addMoney(v) {
  if (locked) return;
  if (R.paid.length >= CAP) return say('הדלפק מלא! 😅 לחצי על מטבע כדי להחזיר אותו');
  R.paid.push(v); drawCounter(); sound('coin');
}
function removeMoney(v) {
  if (locked) return;
  R.paid.splice(R.paid.indexOf(v), 1); drawCounter(); sound('tap');
}

function checkPay() {
  if (locked) return;
  const q = R.q, got = total(R.paid);
  if (!got) return say(q.change ? 'שימי עודף בידיים קודם 🙂' : 'שימי כסף על הדלפק קודם 🙂');
  const price = q.items[0].price;
  if (got === q.ans) {
    let extra = '';
    if (q.change) extra = ltr(`${price} + ${q.ans} = ${q.given}`);
    else if (q.wallet.length === 2 && q.ans % 10 && q.ans > 10) extra = `(${tensOnes(q.ans)})`;
    if (R.paid.length > 1 && R.paid.length === fewest(q.ans, q.wallet).length) extra += ' ובמעט מטבעות! 🏅';
    return win(extra.trim());
  }
  R.peek = true; drawCounter(); // after a miss the sum is visible for this question
  if (++R.tries < 2) {
    if (q.change) say(`${ltr(`${price} + ${got} = ${price + got}`)}. ${got < q.ans ? `צריך להגיע ל-${q.given} 🙂` : `זה יותר מ-${q.given}. לחצי על מטבע כדי להחזיר אותו`}`);
    else say(got < q.ans ? `שמת ${nis(got)}. חסרים עוד ${nis(q.ans - got)} 🙂` : `שמת ${nis(got)}, יותר מ-${nis(q.ans)}. לחצי על מטבע בדלפק כדי להחזיר אותו`);
    return;
  }
  R.paid = fewest(q.ans, q.wallet); drawCounter();
  say(`ככה אפשר: ${ltr(R.paid.join(' + ') + ' = ' + q.ans)} 👀 ממשיכים!`);
  done('ok', 3600);
}

function showRicher(q) {
  $('shelf').innerHTML = `<div class="purses" style="width:100%">${q.purses.map((p, i) => `<button class="purse" data-i="${i}" aria-label="הארנק של ${p.who}">
    <span class="who">${p.who}</span><div class="pieces">${p.coins.map(v => money(v)).join('')}</div><span class="tot" hidden>${nis(p.total)}</span></button>`).join('')}</div>`;
  $('task').textContent = 'למי יש יותר כסף? לחצי על הארנק';
}

function pickPurse(i) {
  if (locked) return;
  locked = true;
  const q = R.q, el = [...$('shelf').querySelectorAll('.purse')], good = q.purses[q.ans], bad = q.purses[1 - q.ans];
  el.forEach(e => e.querySelector('.tot').hidden = false);
  const trap = good.coins.length < bad.coins.length ? ` ל-${bad.who} יש ${coinsHe(bad.coins.length)}, אבל ביחד רק ${nis(bad.total)}.` : '';
  el[q.ans].className = 'purse right';
  if (i === q.ans) return win(`ל-${good.who} יש ${nis(good.total)}.${trap ? ' פחות מטבעות, אבל יותר כסף!' : ''}`);
  el[i].className = 'purse oops';
  say(`בואי נספור:${trap || ` ל-${bad.who} יש ${nis(bad.total)}.`} ל-${good.who} יש ${nis(good.total)}! 👀`);
  done('ok', 4200);
}

function showEnough(q) {
  $('shelf').innerHTML = q.items.map(itemCard).join('');
  $('task').innerHTML = `<span class="cash">יש לך ${fewest(q.budget).map(v => money(v)).join('')} = ${nis(q.budget)}</span>יספיק לך לקנות את כל אלה?`;
}

function pickEnough(a) {
  if (locked) return;
  locked = true;
  const q = R.q, btns = [...$('yn').children], eq = ltr(`${q.items.map(it => it.price).join(' + ')} = ${q.bill}`);
  const why = q.ans ? `${eq}, אז יספיק ויישאר לך ${nis(q.budget - q.bill)}` : `${eq}, אז לא יספיק. חסרים ${nis(q.bill - q.budget)}`;
  btns[q.ans ? 0 : 1].className = 'right';
  if (a === q.ans) return win(why);
  btns[a ? 0 : 1].className = 'oops';
  say(`בואי נבדוק: ${why} 👀`);
  done('ok', 4200);
}

function win(extra = '') {
  const first = R.tries === 0;
  R.streak = first ? R.streak + 1 : 0;
  say(`${pick(PRAISE)} ${extra}${R.streak >= 3 ? ` 🔥 ${R.streak} ברצף!` : ''}`);
  sound('yay'); burst(false); done(first ? 'star' : 'ok', extra ? 2600 : 1400);
}

function done(result, ms) {
  locked = true; R.results.push(result);
  R.missRun = result === 'star' ? 0 : R.missRun + 1;
  R.n++; drawPath(); later(next, ms);
}

function giveSticker() {
  const left = STICKERS.filter(s => !S.stickers.includes(s));
  const s = pick(left.length ? left : STICKERS);
  if (left.length) S.stickers.push(s);
  return {s, isNew: left.length > 0};
}

function finish() {
  const r = R; R = null;
  const stars = r.results.filter(x => x === 'star').length;
  S.stars[r.lvl] = Math.max(S.stars[r.lvl] || 0, stars >= r.total - 1 ? 3 : stars >= r.total / 2 ? 2 : 1);
  const st = giveSticker(); save();
  $('endTitle').textContent = `סיימת את שלב ${r.lvl + 1}! 🎉`;
  $('endText').textContent = stars ? `אספת ${'⭐'.repeat(stars)}` : 'הגעת עד הסוף!';
  $('endSticker').textContent = '';
  const nextLvl = r.lvl < LEVELS.length - 1;
  $('endNext').hidden = !nextLvl; $('endNext').textContent = nextLvl ? `לשלב ${r.lvl + 2} ⬅️` : '';
  const g = $('gift'); g.textContent = '🎁'; g.className = 'gift shake';
  show('end');
  setTimeout(() => {
    g.textContent = st.s; g.className = 'gift pop';
    $('endSticker').textContent = st.isNew ? 'מדבקה חדשה לאלבום! 📒' : 'עוד מדבקה בשבילך!';
    sound('win'); burst(true);
  }, 1100);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  R = null; show(b.dataset.go);
});
$('wallet').onclick = e => { const b = e.target.closest('button'); if (b) addMoney(+b.dataset.v); };
$('counter').onclick = e => { const b = e.target.closest('button'); if (b) removeMoney(+b.dataset.v); };
$('payBtn').onclick = checkPay;
$('shelf').onclick = e => { const b = e.target.closest('.purse'); if (b) pickPurse(+b.dataset.i); };
$('yn').onclick = e => { const b = e.target.closest('button'); if (b) pickEnough(b.dataset.a === '1'); };
$('levels').onclick = e => { const b = e.target.closest('button'); if (b && !b.disabled) startLevel(+b.dataset.l); };
$('buddies').onclick = e => { const b = e.target.closest('button'); if (b) { S.buddy = b.textContent; save(); drawHome(); sound('tap'); } };
$('peek').onclick = () => { if (R?.q?.kind === 'pay') { R.peek = true; drawCounter(); } };
$('clear').onclick = () => { if (R && !locked) { R.paid = []; drawCounter(); } };
// skip swaps in a new, easier question on the same step, so stickers still need real answers
$('skip').onclick = () => { if (R && !locked) { R.easy = true; next(); } };
$('endNext').onclick = () => startLevel(last + 1);
$('endAgain').onclick = () => startLevel(last);
$('mute').onclick = () => { S.muted = !S.muted; save(); $('mute').textContent = S.muted ? '🔇' : '🔊'; };
$('mute').textContent = S.muted ? '🔇' : '🔊';
show('home');
</script>
</html>
